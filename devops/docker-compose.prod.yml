version: '3.9'

# ==============================================================================
# AICTE KOSH-RAKSHAK: HIGH-AVAILABILITY PRODUCTION DOCKER COMPOSE CONFIGURATION
# Designed for Sovereign Government Cloud (NIC / RailTel / MeghRaj Cloud)
# ==============================================================================

networks:
  aicte_internal:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/16

volumes:
  pg_prod_data:
    driver: local
  redis_prod_data:
    driver: local
  forensic_evidence_vault:
    driver: local

services:
  # 1. Reverse Proxy & Edge SSL Termination
  reverse-proxy:
    image: nginx:alpine-slim
    container_name: aicte_edge_proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - aicte_internal
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  # 2. Production React/Vite Frontend
  frontend:
    build:
      context: ..
      dockerfile: devops/Dockerfile.frontend
    container_name: aicte_frontend_portal
    restart: always
    environment:
      - VITE_API_BASE_URL=/api/v1
    networks:
      - aicte_internal
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 20s
      timeout: 5s
      retries: 3
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  # 3. Node.js Core Backend API Microservice
  backend:
    build:
      context: ../backend
      dockerfile: ../devops/Dockerfile.backend
    container_name: aicte_backend_api
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=8080
      - DATABASE_URL=postgresql://aicte_admin:kosh_secure_2026@postgres:5432/aicte_kosh_production
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=sovereign_aicte_kosh_rakshak_super_secret_jwt_key_2026
      - AI_SERVICE_URL=http://ai-forensics:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - aicte_internal
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  # 4. Python AI Forensics Engine (OpenCV + PIL + Tesseract)
  ai-forensics:
    build:
      context: ../ai-forensics
      dockerfile: ../devops/Dockerfile.ai
    container_name: aicte_ai_forensics
    restart: always
    environment:
      - PYTHONUNBUFFERED=1
      - WORKERS=4
    volumes:
      - forensic_evidence_vault:/app/evidence_vault
    networks:
      - aicte_internal
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8000/health"]
      interval: 20s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4096M

  # 5. PostgreSQL 16 Enterprise Database
  postgres:
    image: postgres:16-alpine
    container_name: aicte_pg_primary
    restart: always
    environment:
      POSTGRES_DB: aicte_kosh_production
      POSTGRES_USER: aicte_admin
      POSTGRES_PASSWORD: kosh_secure_2026
    volumes:
      - pg_prod_data:/var/lib/postgresql/data
      - ../database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ../database/seeds/sample_fdrs.sql:/docker-entrypoint-initdb.d/02_seeds.sql:ro
    networks:
      - aicte_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aicte_admin -d aicte_kosh_production"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  # 6. Redis In-Memory Cache & Session Lock
  redis:
    image: redis:7-alpine
    container_name: aicte_redis_cache
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "kosh_redis_pass_2026"]
    volumes:
      - redis_prod_data:/data
    networks:
      - aicte_internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "kosh_redis_pass_2026", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M

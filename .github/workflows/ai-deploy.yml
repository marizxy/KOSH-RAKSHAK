name: AI Forensics Engine CI/CD Pipeline

on:
  push:
    paths:
      - 'ai-forensics/**'
      - '.github/workflows/ai-deploy.yml'
    branches: [ main ]

jobs:
  ai-pipeline:
    name: Build & Verify AI ELA Forensics Service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'ai-forensics/requirements.txt'

      - name: Install System Dependencies (Tesseract & OpenCV)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr libgl1 libglib2.0-0

      - name: Install Python AI Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ai-forensics/requirements.txt

      - name: Validate ELA Scanner & Compounding Math Model
        run: |
          python -c "
          import cv2
          import numpy as np
          from PIL import Image
          print('✓ OpenCV Version:', cv2.__version__)
          print('✓ PIL / Pillow loaded successfully.')
          print('✓ ELA Algorithm ready for forensic ingestion.')
          "
          python ai-forensics/ela_analyzer.py
